@media (prefers-reduced-motion:reduce){.cf{display:none}}
.back{display:inline-block;margin:0 0 10px 4px;font-weight:800;font-size:.95rem;color:var(--ac);text-decoration:none}.back:hover,.back:focus-visible{text-decoration:underline}

var T={"title": ["What’s your Spanish level?", "Mis on sinu hispaania keele tase?", "Какой у вас уровень испанского?"], "sub": ["A friendly test from A1 to C1 · about 15 minutes · {n} questions · the questions are in Spanish", "Sõbralik test tasemetel A1 kuni C1 · umbes 15 minutit · {n} küsimust · küsimused on hispaania keeles", "Дружелюбный тест от A1 до C1 · около 15 минут · {n} вопросов · вопросы на испанском"], "intro": ["The questions get harder as you go. Not sure of an answer? Press “I don’t know”. You can also stop at any moment and see your level.", "Küsimused muutuvad järk-järgult raskemaks. Ei tea vastust? Vajuta „Ei tea”. Võid igal hetkel peatuda ja oma taset näha.", "Вопросы постепенно усложняются. Не знаете ответ? Нажмите «Не знаю». Вы можете остановиться в любой момент и увидеть свой уровень."], "startb": ["Start the test ✨", "Alusta testi ✨", "Начать тест ✨"], "idk": ["I don’t know", "Ei tea", "Не знаю"], "stop": ["Stop here and show my level", "Peatu siin ja näita minu taset", "Остановиться и показать мой уровень"], "well": ["🎉 Well done!", "🎉 Suurepärane!", "🎉 Отлично!"], "ans": ["You answered {a} of {b} questions. Your level is", "Sa vastasid {a} küsimusele {b}-st. Sinu tase on:", "Вы ответили на {a} из {b} вопросов. Ваш уровень:"], "beg": ["Absolute beginner", "Päris algaja", "Абсолютный новичок"], "note": ["Your level is the highest one where you got at least 4 of 6 right, with all lower levels passed. This is a quick estimate, not an official exam.", "Sinu tase on kõrgeim, kus vastasid õigesti vähemalt 4 küsimusele 6-st ning kõik madalamad tasemed on läbitud. See on kiire hinnang, mitte ametlik eksam.", "Ваш уровень – самый высокий, на котором вы ответили правильно минимум на 4 из 6 вопросов, при условии что все предыдущие уровни пройдены. Это быстрая оценка, а не официальный экзамен."], "nxt": ["Your next goal: {l}. You are closer than you think! 🚀", "Sinu järgmine eesmärk: {l}. Oled lähemal, kui arvad! 🚀", "Ваша следующая цель: {l}. Вы ближе, чем думаете! 🚀"], "top": ["You reached the top level. Let’s polish it to perfection! 🏆", "Sa jõudsid kõrgeimale tasemele. Lihvime selle täiuslikuks! 🏆", "Вы достигли высшего уровня. Давайте отшлифуем его до совершенства! 🏆"], "ft": ["💬 Copy your result and send it to Julia!", "💬 Kopeeri oma tulemus ja saada see Juliale!", "💬 Скопируйте результат и отправьте Юлии!"], "fs": ["You did it, and that already takes courage! 🎉 Press the button to copy your result, then paste it for Julia on the website in the language you chose – she will reply personally and help you reach the next level.", "Sa tegid selle ära ja see nõuab juba julgust! 🎉 Vajuta nuppu, et tulemus kopeerida, ja kleebi see Juliale veebilehel sinu valitud keeles – ta vastab isiklikult ja aitab sul jõuda järgmisele tasemele.", "Вы справились, а это уже смелый шаг! 🎉 Нажмите кнопку, скопируйте результат и вставьте его для Юлии на сайте на выбранном вами языке – она ответит лично и поможет вам достичь следующего уровня."], "free": ["🎁 Send it and get a free lesson!", "🎁 Saada ja saa tasuta tund!", "🎁 Отправьте и получите бесплатный урок!"], "cp": ["Copy my results", "Kopeeri tulemused", "Скопировать результаты"], "cpd": ["Copied ✓", "Kopeeritud ✓", "Скопировано ✓"], "again": ["Take the test again", "Tee test uuesti", "Пройти тест заново"]};
